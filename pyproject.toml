[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tebya-zovut-bot"
version = "1.0.0"
description = "Telegram bot that sends private notifications when users are mentioned in work chats"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.27,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[project.urls]
Repository = "https://github.com/emmzde/call-you-bot"
Issues = "https://github.com/emmzde/call-you-bot/issues"

[project.scripts]
tebya-zovut-bot = "tebya_zovut_bot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP"]

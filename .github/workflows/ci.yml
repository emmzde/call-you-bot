name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Validate deployment scripts
        run: |
          bash -n deploy/*.sh
          shellcheck deploy/*.sh

      - name: Test
        run: pytest

      - name: Audit Python dependencies
        run: >-
          pip-audit --skip-editable --progress-spinner off
          --timeout 10 --vulnerability-service osv

      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          BOT_TOKEN=ci-placeholder docker compose config --quiet
          BOT_TOKEN_SECRET_FILE=.env.example docker compose \
            -f docker-compose.yml -f docker-compose.secrets.yml config --quiet

      - name: Build production image
        run: docker build --tag call-you-bot:ci .
